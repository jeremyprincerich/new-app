<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Cahier de Recettes</title>
    <script>
      // GitHub Pages 404 fallback: redirect to the SPA root.
      var path = location.pathname.replace(/^\/[^/]+/, "");
      location.replace(location.origin + location.pathname.split("/").slice(0, 2).join("/") + "/" + (path && path !== "/" ? "#" + path : ""));
    </script>
  </head>
  <body></body>
</html>
